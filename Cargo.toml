[package]
name = "vcs-lint"
version = "0.1.0-alpha.2"
edition = "2024"
description = "A Simple, Fast Linter for Commit Messages and Branch Names in Version Control Systems"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
clap = { version = "~4.6", features = ["derive"] }
derive_more = { version = "~2.1", features = ["display"] }
regex = "~1.13"

[dev-dependencies]
insta = "~1.49"
tempfile = "~3.27"
